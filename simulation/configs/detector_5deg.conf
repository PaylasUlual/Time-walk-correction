#This is the template generate_configs.py uses to produce an output file per incidence angle into configs/
#generate_configs.py overwrites the number_of_events, beam_direction and file_name from this template

[Allpix]
model_paths= "../models/"
random_seed= 42 #Fixed seed so it is the same for every angle
number_of_events = 17000
detectors_file=  "../detector.geo"

[GeometryBuilderGeant4]
world_minimum_margin= 15mm 15mm 15mm #Gives empty space around the sensor

[DepositionGeant4]
particle_type= "proton"
source_energy= 120GeV
source_position= 0mm 0mm -1mm
beam_direction = 0.087156 0.000000 0.996195
beam_shape= "rectangle"
beam_size= 1.5mm 3.8mm
flat_beam= true #Uniform

[ElectricFieldReader]
model= "linear"
voltage= 230V #Operating bias point
depletion_voltage= 80V

[GenericPropagation]
temperature= 293K
propagate_electrons= false #Holes are propagated rather than electrons.This is based on the electric field polarity of the LGAD design
propagate_holes= true
integration_time= 2ns

[PulseTransfer]
max_depth_distance= 5um

#Charge sensitive amplifier
[CSADigitizer]
model= "simple"
feedback_capacitance= 5e-15C/V
rise_time_constant= 0.5ns
feedback_time_constant= 5ns
integration_time= 2ns
threshold= 10mV #Discriminator level
sigma_noise= 0.5mV
clock_bin_toa= 10ps #TDC bin width
#clock_bin_tot= 10ps  


[ROOTObjectWriter]
file_name = "../data/output_5deg.root"